name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Build release archives
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          binary_name="falken-vector-tui"
          cmd_path="./cmd/falken-vector-tui"
          mkdir -p dist

          targets=(
            "darwin/amd64"
            "darwin/arm64"
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          for target in "${targets[@]}"; do
            goos="${target%/*}"
            goarch="${target#*/}"
            package_name="${binary_name}_${VERSION}_${goos}_${goarch}"
            package_dir="dist/${package_name}"
            executable="${package_dir}/${binary_name}"

            mkdir -p "${package_dir}"
            if [[ "${goos}" == "windows" ]]; then
              executable="${executable}.exe"
            fi

            GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -o "${executable}" "${cmd_path}"

            if [[ "${goos}" == "windows" ]]; then
              (cd dist && zip -qr "${package_name}.zip" "${package_name}")
            else
              tar -C dist -czf "dist/${package_name}.tar.gz" "${package_name}"
            fi
          done

          rm -rf dist/*/
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
